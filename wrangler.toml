# Cloudflare Workers 静态资产（Workers Assets）配置。
# 站点 = 一个（空脚本）Worker + ./dist 静态资产，取代 Pages：
# - `npx wrangler deploy` 一条命令部署（自动带 *.workers.dev 子域）
# - 自定义域名走 Worker Custom Domains：zone 在同一账号时会【自动创建 DNS 记录】，
#   无需手动验证——这是它相对 Pages 自定义域名的关键差异
name = "zcodestats"
main = "worker/index.js"
# 纯静态、无运行时特性依赖；钉死是为了让旧版本地 workerd 也能 `wrangler dev`
compatibility_date = "2026-08-08"

# Workers Builds 部署链路：wrangler deploy 前自动执行（CI 上没有本机的 dist，必须先构建）
[build]
command = "pnpm build"

[assets]
directory = "./dist"
binding = "ASSETS"

# 自动绑定自定义域名（可选）：取消注释、改成你的域名后重新 deploy，
# Cloudflare 会在 zone 里自动建 DNS 记录，无需去面板手动验证：
# routes = [
#   { pattern = "stats.casing-ai.com", custom_domain = true }
# ]
